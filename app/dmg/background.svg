<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <!-- The Hark disk image window. Finder draws the two icons on top at
       (170, 200) and (470, 200), with their names below them at about y 284.
       app/scripts/make-icon.sh renders this to background.tiff. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef0f6"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="262" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#36c6ff"/><stop offset="0.5" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="3" markerHeight="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0.6 0.9 L9.2 5 L0.6 9.1 Q0 5 0.6 0.9 Z" fill="#ff4f9a" stroke="#ff4f9a" stroke-width="0.8" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="url(#paper)"/>

  <g font-family="Helvetica Neue" text-anchor="middle">
    <text x="320" y="66" font-weight="700" font-size="28" fill="#14161c">Install Hark in one step</text>
    <text x="320" y="94" font-size="15" fill="#5b6070">Drag the Hark icon onto the Applications folder.</text>
  </g>

  <path d="M268 200 L 356 200" fill="none" stroke="url(#arrow)" stroke-width="14" stroke-linecap="round" marker-end="url(#head)"/>

  <rect x="0" y="320" width="640" height="100" fill="#14161c" fill-opacity="0.04"/>
  <g font-family="Helvetica Neue" text-anchor="middle">
    <circle cx="120" cy="350" r="12" fill="#7b5cff"/>
    <text x="120" y="354.5" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="120" y="384" font-size="13.5" fill="#2a2e38">Drag Hark into Applications</text>
    <circle cx="320" cy="350" r="12" fill="#7b5cff"/>
    <text x="320" y="354.5" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="320" y="384" font-size="13.5" fill="#2a2e38">Open Hark</text>
    <circle cx="520" cy="350" r="12" fill="#7b5cff"/>
    <text x="520" y="354.5" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="520" y="384" font-size="13.5" fill="#2a2e38">Press F5 and talk</text>
  </g>
</svg>
