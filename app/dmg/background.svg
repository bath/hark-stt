<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <!-- The Hark disk image window. Finder draws the two icons on top at
       (170, 200) and (470, 200); app/scripts/make-icon.sh renders it to background.tiff. -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e7ebef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7b5cff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7b5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="258" y1="0" x2="384" y2="0">
      <stop offset="0" stop-color="#36c6ff"/><stop offset="0.5" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff4f9a"/>
    </linearGradient>
    <radialGradient id="well" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#101318" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#101318" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="420" fill="url(#paper)"/>
  <circle cx="170" cy="200" r="120" fill="url(#glow)"/>
  <circle cx="470" cy="200" r="110" fill="url(#well)"/>

  <text x="320" y="62" text-anchor="middle" font-family="Helvetica Neue" font-weight="700" font-size="24" letter-spacing="-0.3" fill="#101318">Drag Hark to Applications</text>
  <text x="320" y="88" text-anchor="middle" font-family="Helvetica Neue" font-size="14" fill="#5b646e">Private dictation that runs on your Mac.</text>

  <g fill="none" stroke="url(#arrow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M258 206 C 300 178, 344 178, 382 202"/>
    <path d="M364 188 L 384 203 L 362 214"/>
  </g>

  <g font-family="Helvetica Neue" text-anchor="middle">
    <rect x="186" y="352" width="268" height="36" rx="18" fill="#101318" fill-opacity="0.05"/>
    <text x="320" y="375" font-size="14" fill="#3b424a">Then press <tspan font-weight="700" fill="#101318">F5</tspan>, talk, and press <tspan font-weight="700" fill="#101318">F5</tspan> again.</text>
  </g>
</svg>
