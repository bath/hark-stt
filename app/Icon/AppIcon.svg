<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<!-- Hark.app icon: a plain studio microphone, like the 🎙 emoji, on the record red.
     app/scripts/make-icon.sh renders it to app/Resources/AppIcon.icns. -->
<defs>
  <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#9aa4ae"/><stop offset="0.18" stop-color="#f4f6f8"/>
    <stop offset="0.45" stop-color="#c3cbd3"/><stop offset="0.75" stop-color="#eef1f4"/>
    <stop offset="1" stop-color="#7d8792"/>
  </linearGradient>
  <linearGradient id="yoke" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6f7983"/><stop offset="0.3" stop-color="#d9dee3"/>
    <stop offset="0.7" stop-color="#aab3bc"/><stop offset="1" stop-color="#5f6973"/>
  </linearGradient>
  <linearGradient id="stem" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5f6973"/><stop offset="0.4" stop-color="#d4dae0"/><stop offset="1" stop-color="#59626c"/>
  </linearGradient>
  <linearGradient id="darkmetal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#707a85"/><stop offset="1" stop-color="#2f353c"/>
  </linearGradient>
  <radialGradient id="knob" cx="0.38" cy="0.35" r="0.75">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#7c8691"/>
  </radialGradient>
  <pattern id="mesh" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="6.5" fill="#56606b"/>
  </pattern>
  <linearGradient id="gloss" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.28" stop-color="#fff" stop-opacity="0.22"/>
    <stop offset="0.45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-100%" width="140%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="shadow" color-interpolation-filters="sRGB" x="-10%" y="-10%" width="120%" height="125%">
    <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.30"/>
  </filter>

  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef5a4c"/><stop offset="1" stop-color="#c4352a"/></linearGradient>
</defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#000" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

<g transform="translate(512 500) scale(1.1) translate(-512 -500)">
  <!-- shadow under the base -->
  <ellipse cx="512" cy="812" rx="190" ry="26" fill="#000" opacity="0.28" filter="url(#soft)"/>
  <!-- base -->
  <path d="M352 800 q0 -46 60 -54 h200 q60 8 60 54 v8 q0 14 -14 14 h-292 q-14 0 -14 -14z" fill="url(#darkmetal)"/>
  <path d="M372 760 q20 -12 50 -14 h180 q30 2 50 14" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="6" stroke-linecap="round"/>
  <!-- stem -->
  <rect x="490" y="610" width="44" height="150" rx="10" fill="url(#stem)"/>
  <!-- yoke -->
  <path d="M352 392 v40 a160 160 0 0 0 320 0 v-40" fill="none" stroke="url(#yoke)" stroke-width="40" stroke-linecap="round"/>
  <!-- head -->
  <rect x="384" y="178" width="256" height="400" rx="128" fill="url(#chrome)"/>
  <rect x="408" y="202" width="208" height="352" rx="104" fill="#1d2228"/>
  <rect x="408" y="202" width="208" height="352" rx="104" fill="url(#mesh)"/>
  <rect x="408" y="202" width="208" height="352" rx="104" fill="url(#gloss)"/>
  <!-- band -->
  <rect x="384" y="362" width="256" height="40" fill="url(#chrome)"/>
  <rect x="384" y="362" width="256" height="40" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="2"/>
  <!-- pivots -->
  <circle cx="372" cy="392" r="28" fill="url(#knob)"/>
  <circle cx="652" cy="392" r="28" fill="url(#knob)"/>
  <circle cx="372" cy="392" r="9" fill="#5b646e"/>
  <circle cx="652" cy="392" r="9" fill="#5b646e"/>

</g>
</svg>