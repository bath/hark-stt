@media (prefers-color-scheme: dark) {

}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink);
  font: 17px/1.55 -apple-system, BlinkMacSystemFont, ui-sans-serif, "Helvetica Neue", Arial, sans-serif;
  display: grid; place-items: start; padding: 0 clamp(16px, 4vw, 48px);
}
.pill {
  margin: 0 auto; height: 40px; width: 230px; max-width: 100%; border-radius: 0 0 22px 22px; background: #000; color: #f4f5f7;
  display: flex; align-items: center; justify-content: center; gap: 9px; font: 600 13px/1 -apple-system, sans-serif;
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #ff4a3d; }
main { max-width: 40rem; padding: 18vh 0 48px; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0; }
p { color: var(--ink-2); margin: 16px 0 0; }
a { color: var(--ink); text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--rec); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
