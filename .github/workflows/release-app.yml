# Builds, signs, notarizes and uploads the Hark.app disk image to the GitHub
# release v<version> (make the release first). Run it by hand from the
# Actions tab. It needs these repository secrets:
#   DEVELOPER_ID_P12           the "Developer ID Application" certificate and key, .p12, base64
#   DEVELOPER_ID_P12_PASSWORD  its password
#   DEVELOPER_ID_IDENTITY      "Developer ID Application: Name (TEAMID)"
#   NOTARY_KEY_P8              an App Store Connect API key (.p8 contents)
#   NOTARY_KEY_ID, NOTARY_ISSUER
name: Release Hark.app

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/hark.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$P12" | base64 --decode >"$RUNNER_TEMP/id.p12"
          security import "$RUNNER_TEMP/id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/id.p12"

      - name: Build, sign, notarize and upload
        env:
          HARK_SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          HARK_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          HARK_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$NOTARY_KEY_P8" >"$RUNNER_TEMP/notary.p8"
          HARK_NOTARY_KEY="$RUNNER_TEMP/notary.p8" app/scripts/release.sh --upload
